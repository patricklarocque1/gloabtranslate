[versions]
# Core Build Tooling
# Gradle 9.1.0 is the latest stable release (Supports Java 25)
# Note: This version is set in gradle/wrapper/gradle-wrapper.properties
# gradle = "9.1.0" # This line is often excluded but useful for reference

# Android Gradle Plugin
agp = "8.13.0"

# Android SDK versions
compileSdk = "36"
minSdk = "34"
targetSdk = "36"
buildTools = "36.0.0"

# Core Android dependencies
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
uiautomator = "2.3.0"
benchmarkMacroJunit4 = "1.4.1"

# Kotlin
kotlin = "2.2.20"
kotlinCompiler = "2.2.20"

# Compose
compose-bom = "2025.01.00"
compose-activity = "1.11.0"

# Kotlin Coroutines (confirmed latest stable as of Aug 30, 2024)
coroutines = "1.10.2"

# ML Kit dependencies (confirmed latest as of Aug 7, 2024)
mlkit-translate = "17.0.3"
mlkit-language-id = "17.0.6"

# Media3 dependencies (confirmed latest stable as of Aug 9, 2024)
media3 = "1.8.0"

# Lifecycle dependencies (confirmed latest as of Aug 9, 2024)
lifecycle = "2.9.4"

# Play Services dependencies
play-services-tflite = "16.4.0"
play-services-mlkit-text-recognition = "19.0.0"

# Kotlin Serialization
kotlinx-serialization-json = "1.6.0"

# Testing dependencies
mockito = "5.8.0"
mockito-kotlin = "5.3.1"
mockito-inline = "4.5.1"
mockk = "1.13.8" # Added MockK version
test-rules = "1.7.0"
test-runner = "1.7.0"
robolectric = "4.16" # Added Robolectric version
truth = "1.1.3" # Google Truth testing library
hamcrest = "2.2" # Hamcrest matchers

# Security and encryption
security-crypto = "1.1.0"

# Room database (if needed)
room = "2.8.1"

# Navigation
navigation = "2.9.5"

# Work Manager
work = "2.10.5"

# Dagger (Dependency Injection)
dagger = "2.57.1"

# KSP (Kotlin Symbol Processing)
ksp = "2.2.20-2.0.3"

# Firebase (if needed)
firebase-bom = "33.1.2"

# App versioning
versionCode = "1"
versionName = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-espresso-idling-resource = { group = "androidx.test.espresso", name = "espresso-idling-resource", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }

# Kotlin Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose BOM and libraries
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-activity" }

# ML Kit libraries (confirmed latest versions)
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkit-translate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkit-language-id" }
# Using Android Speech API instead of ML Kit speech recognition

# Media3 libraries (confirmed latest versions)
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

# Lifecycle libraries (updated to latest)
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Play Services libraries
play-services-tflite-java = { group = "com.google.android.gms", name = "play-services-tflite-java", version.ref = "play-services-tflite" }

# Kotlin Serialization libraries
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# Testing libraries
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito" }
mockito-inline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockito-inline" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" } # Added MockK library
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
test-rules = { group = "androidx.test", name = "rules", version.ref = "test-rules" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" } # Added Robolectric library
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" } # Added kotlin-test-junit
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" } # Google Truth testing library
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" } # Hamcrest matchers

# Security libraries
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# Room database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Navigation
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Work Manager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Dagger
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }
dagger-android = { group = "com.google.dagger", name = "dagger-android", version.ref = "dagger" }
dagger-android-processor = { group = "com.google.dagger", name = "dagger-android-processor", version.ref = "dagger" }
dagger-android-support = { group = "com.google.dagger", name = "dagger-android-support", version.ref = "dagger" }

# Firebase BOM
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
