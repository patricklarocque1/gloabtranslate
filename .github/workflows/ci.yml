name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Build
        run: ./gradlew --stacktrace --no-daemon build

      - name: Unit Tests (summary)
        if: always()
        run: |
          echo "Collecting test results"
          if [ -d build/test-results ]; then find build/test-results -name '*.xml' | head; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Lint (Android)
        run: ./gradlew lintVitalRelease || ./gradlew lint || echo "Lint step skipped or failed (non-blocking)"

      - name: Dependency updates task (optional)
        run: |
          ./gradlew tasks | grep -i dependencyUpdates && ./gradlew dependencyUpdates -Drevision=release || echo "Versions plugin not configured"

      - name: Assemble Release (smoke)
        run: ./gradlew :app:assembleRelease

      - name: Upload APK (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
